<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Helpdesk</title>
    <!-- Apply the stored theme before first paint so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var t = q || localStorage.getItem('sp.theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', t === 'dark')

          var dq = new URLSearchParams(location.search).get('design')
          var d = dq || localStorage.getItem('sp.design') || 'studio'
          document.documentElement.setAttribute('data-design', d)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
